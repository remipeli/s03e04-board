<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="build" content="__BUILD_SHA__" />
    <title>sched-prod · incidents</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <header>
      <h1>incidents</h1>
      <p class="sub">sched-prod · tonight</p>
    </header>
    <main data-testid="board">
      <p data-testid="loader" class="loader" role="status">Loading tonight's incidents…</p>
      <p data-testid="empty" class="empty" hidden>No incidents tonight.</p>
      <p class="error" role="alert" hidden></p>
      <ul data-testid="incident-list" class="list"></ul>
    </main>
    <dialog data-testid="confirm" class="confirm" aria-labelledby="confirm-title">
      <form method="dialog">
        <p id="confirm-title" class="confirm-title">Ack <strong class="confirm-id"></strong>?</p>
        <p class="confirm-what"></p>
        <div class="confirm-actions">
          <button value="cancel" data-testid="confirm-cancel" autofocus>Cancel</button>
          <button value="ack" data-testid="confirm-ack" class="primary">Ack <span class="confirm-id"></span></button>
        </div>
      </form>
    </dialog>
    <footer>sched-prod incident board · build <span data-testid="build-sha">__BUILD_SHA__</span></footer>
  </body>
</html>
